syntax = "proto3";

option csharp_namespace = "Todo.Worker.Contracts";

package todo.worker.v1;

service TodoWorker {
  rpc RecordTodoCreated (TodoCreatedRequest) returns (TodoCreatedReply);
}

message TodoCreatedRequest {
  string title = 1;
  string request_id = 2;
  string source = 3;
}

message TodoCreatedReply {
  bool accepted = 1;
  string message = 2;
}
