properties:
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: false
      targetPort: 8080
      transport: http2
      allowInsecure: true
  template:
    containers:
      - name: worker
        image: octoengineacr-bjeug7bydkbcdtdt.azurecr.io/octo-engine-worker:v2
        env:
          - name: DOTNET_ENVIRONMENT
            value: Production
          - name: ASPNETCORE_URLS
            value: http://+:8080
          - name: Worker__ServiceName
            value: octo-engine-worker
          - name: Worker__IntervalSeconds
            value: "15"
          - name: Worker__Scenario
            value: Background todo digest processor for the ACA classroom demo.
        resources:
          cpu: 0.25 
          memory: 0.5Gi
        probes:
          - type: Liveness
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          - type: Readiness
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
    scale:
      minReplicas: 1
      maxReplicas: 1
