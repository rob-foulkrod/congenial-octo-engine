properties:
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: true
      targetPort: 8080
      transport: auto
      allowInsecure: false
      traffic:
        - latestRevision: true
          weight: 100
  template:
    containers:
      - name: web
        image: octoengineacr-bjeug7bydkbcdtdt.azurecr.io/octo-engine-web:v2
        env:
          - name: ASPNETCORE_URLS
            value: http://+:8080
          - name: ASPNETCORE_ENVIRONMENT
            value: Production
          - name: WorkerGrpc__Address
            value: http://octo-engine-worker
        resources:
          cpu: 0.5
          memory: 1.0Gi
    scale:
      minReplicas: 1
      maxReplicas: 2
